[pytest]
testpaths = tests
# 测试临时文件和 pytest 自身缓存统一放在项目 F 盘的 data 目录。
# 该目录已由 data/ 的忽略规则排除，不会提交 Git，也不会占用系统盘。
# 使用分开的目录，避免 pytest 清理 basetemp 时碰到缓存文件。basetemp
# 的直接父目录必须预先存在，因此这里以项目已有的 data/ 为父目录。
addopts = -q --basetemp=data/.pytest-temp
cache_dir = data/.pytest-cache
filterwarnings =
    ignore::DeprecationWarning
